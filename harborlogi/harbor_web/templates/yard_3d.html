{% if yard_scene %}
<div class="yard-view-switch" data-yard-views hidden aria-label="배치 보기 방식"><button type="button" class="quiet" data-yard-view="3d" aria-pressed="true">3D 배치</button><button type="button" class="quiet" data-yard-view="flat" aria-pressed="false">층별 평면</button></div>
{{ yard_scene|json_script:'yard-scene-data' }}
<section class="yard-3d" data-yard-3d data-scene="yard-scene-data" hidden aria-label="컨테이너 3D 배치">
  <div class="scene-heading"><div><strong data-scene-step>관측한 배치</strong><span>논리 배치 · 실측 크기·현장 좌표 아님</span></div><button class="quiet" type="button" data-scene-play aria-pressed="false">계획 재생</button></div>
  <canvas tabindex="0" role="img" aria-label="회전 가능한 컨테이너 배치. 드래그 또는 방향키로 회전, 더하기·빼기로 확대, Home으로 초기화. 화물 선택은 아래 목록에서도 가능합니다."></canvas>
  <div class="scene-toolbar"><div class="scene-camera" role="group" aria-label="보기 각도"><button class="quiet" type="button" data-scene-camera="iso">입체</button><button class="quiet" type="button" data-scene-camera="front">정면</button><button class="quiet" type="button" data-scene-camera="top">위에서</button></div><div role="group" aria-label="확대"><button class="quiet" type="button" data-scene-zoom="-0.15" aria-label="축소">−</button><button class="quiet" type="button" data-scene-zoom="0.15" aria-label="확대">+</button></div><span>드래그 회전 · 박스 선택</span></div>
  <div class="scene-selection"><label>화물 살펴보기<select data-scene-cargo><option value="">화물 선택</option></select></label><p data-scene-info role="status">박스를 선택하면 크기와 위치를 확인할 수 있습니다.</p></div>
  <p class="scene-motion" data-scene-motion role="status">원본 관측 배치</p><p class="helptext">재생은 계획 순서 설명입니다. 실제 로봇 이동 경로나 수행 상태가 아니며, 관측 원본은 바뀌지 않습니다.</p>
</section><p class="notice" data-yard-3d-fallback hidden>이 환경에서는 3D를 표시할 수 없습니다. 같은 원본의 평면도로 확인하세요.</p>
{% endif %}
