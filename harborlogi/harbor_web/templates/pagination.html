{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="목록 페이지">{% if page.has_previous %}<a href="?{{ query }}&amp;page={{ page.previous_page_number }}">이전</a>{% else %}<span>첫 페이지</span>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?{{ query }}&amp;page={{ page.next_page_number }}">다음</a>{% else %}<span>마지막 페이지</span>{% endif %}</nav>{% endif %}
