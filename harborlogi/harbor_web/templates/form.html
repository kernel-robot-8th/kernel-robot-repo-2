{% extends 'base.html' %}{% block title %}{{ title }}{% endblock %}{% block content %}
<div class="page-head"><div><h1>{{ title }}</h1><p>{{ description }}</p></div></div>
<form class="form-panel" method="post">{% csrf_token %}{{ form.as_div }}<div class="actions"><button type="submit">저장</button><a href="{% if section == 'cargo' %}/requests/{% elif section == 'settings' %}/settings/{% elif section == 'inventory' %}/inventory/{% elif section == 'records' %}/records/{% else %}/field/{% endif %}">목록으로 돌아가기</a></div></form>{% endblock %}
