<section id="planning"><h2>반출 순서를 고려한 입고 자동 배치</h2><p>관측한 점유·크기·지지·도달 범위를 검사하고, 먼저 나갈 화물을 새로 막는 경우를 줄이는 위치를 계산합니다. 입고 우선순위를 반출 순서로 간주하지 않습니다.</p>
