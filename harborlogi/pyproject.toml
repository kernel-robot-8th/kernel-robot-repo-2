[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "harborlogi"
version = "0.1.0"
description = "HarborLogi port retrieval app (Harbor) above the ROSY platform"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["harbor*"]
