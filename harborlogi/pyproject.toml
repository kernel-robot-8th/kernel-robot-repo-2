[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "harborlogi"
version = "0.1.0"
description = "HarborLogi port retrieval app (Harbor) above the ROSY platform"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["harbor*"]

[tool.setuptools.package-data]
harbor = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.setuptools.data-files]
"share/harborlogi/brand" = ["assets/brand/harbor-app-icon-20261023.png", "assets/brand/harborlogi-github-banner-20261023.png"]
